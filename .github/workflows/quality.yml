name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Standalone server smoke test
        run: |
          PORT=3101 HOSTNAME=127.0.0.1 npm start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3101/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3101/ > /dev/null
          curl --fail --silent --head http://127.0.0.1:3101/manifold.wasm |
            grep --ignore-case "cache-control: public"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: npm run test:e2e
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MOZ_WEBRENDER: "1"

      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag moldify:ci .

      - name: Smoke test production image
        run: |
          docker run --detach --name moldify-ci --publish 3102:3000 moldify:ci
          trap 'docker rm --force moldify-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3102/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3102/ > /dev/null
          curl --fail --silent --head http://127.0.0.1:3102/manifold.wasm > /dev/null
